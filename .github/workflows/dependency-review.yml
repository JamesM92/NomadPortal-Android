name: Dependency Review

# Runs on every PR that changes a dependency manifest (build.gradle.kts,
# libs.versions.toml, etc.) and fails the check before merge — the point is
# to catch a bad/vulnerable dependency at the moment it's proposed, not
# months later once the codebase has built on top of it and pivoting away
# is expensive.
on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          # PolyForm Noncommercial 1.0.0 (this repo's own license) is fine
          # with permissive/copyleft incoming deps — RNS/LXMF are MIT. The
          # denial list here is about not accidentally taking on a
          # dependency whose license actively conflicts with redistributing
          # this app at all (e.g. AGPL pulled into something we ship as a
          # compiled APK without also shipping full corresponding source).
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
