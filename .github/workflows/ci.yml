name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Real, project-specific footgun this catches: local dev always needs a
  # temporary `buildPython("C:/path/to/python.exe")` override in
  # app/build.gradle.kts (see the chaquopy-build-cycle convention this
  # repo's own README documents), which must be removed again before
  # committing — it's a machine-specific, possibly-third-party path that
  # means nothing on any other machine or CI runner. This has been missed
  # and caught by hand more than once this project's history; a 5-second
  # grep here catches it for good instead of relying on remembering every
  # time.
  sanity-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: No committed buildPython() override
        run: |
          if grep -n '^\s*buildPython(' app/build.gradle.kts; then
            echo "::error file=app/build.gradle.kts::A buildPython() override is committed — this is a machine-specific local-dev path (see the chaquopy-build-cycle convention) and must never be committed. Remove it before pushing."
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    # settings.gradle.kts's includeBuild() reads these to find
    # micron2compose/RNS_BLE_Wrapper — see its matching comment for the
    # full story. Must be a path relative to this repo's own root (not
    # the runner's outer work dir), since that's what Gradle's
    # includeBuild() resolves it against.
    env:
      MICRON2COMPOSE_DIR: micron2compose
      RNS_BLE_WRAPPER_DIR: RNS_BLE_Wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # settings.gradle.kts composite-builds micron2compose (it isn't
      # published, so there's no Maven coordinate to just resolve).
      # `path: micron2compose` lands it as a *subdirectory* of this repo's
      # own checkout, not a true OS-level sibling the way local dev has it
      # — actions/checkout@v7 flatly refuses `path: ../micron2compose`
      # (a real failure hit here: "Repository path '.../micron2compose' is
      # not under '.../NomadPortal-Android'"), since v7 enforces that every
      # checkout stays under $GITHUB_WORKSPACE. MICRON2COMPOSE_DIR above is
      # what tells settings.gradle.kts to look here instead of its local-
      # dev default.
      # Pinned to `dev`, not `main`: `dev` is what's actually being built/
      # tested against locally right now (micron2compose's own `main` only
      # gets updates once it's agreed "ready" — see that repo's own
      # workflow convention). This does couple this build's CI health to
      # micron2compose's `dev` branch being buildable — acceptable while
      # both repos are developed in lockstep pre-release, but revisit once
      # micron2compose is actually published (delete this step, the env var
      # above, and settings.gradle.kts's includeBuild block together).
      - name: Checkout micron2compose (composite-build dependency)
        uses: actions/checkout@v7
        with:
          repository: JamesM92/micron2compose
          ref: dev
          path: micron2compose

      # Same composite-build shape as micron2compose above, for the same
      # reason (not published anywhere yet — see settings.gradle.kts's
      # own matching comment). Pinned to feature/nomadportal-integration-fixes,
      # not main: that branch carries the real integration work this
      # composite build actually depends on (including the
      # com.jamesm92.rnsble group-ID rename settings.gradle.kts's own
      # dependencySubstitution needs) — RNS_BLE_Android-Wrapper's own
      # main predates all of it. Same "developed in lockstep pre-release,
      # revisit once published" reasoning as micron2compose.
      - name: Checkout RNS_BLE_Wrapper (composite-build dependency)
        uses: actions/checkout@v7
        with:
          repository: JamesM92/RNS_BLE_Android-Wrapper
          ref: feature/nomadportal-integration-fixes
          path: RNS_BLE_Wrapper

      # Fails the build if gradlew/gradlew.bat/gradle-wrapper.jar don't match
      # a known-good Gradle wrapper checksum — catches a tampered wrapper
      # before it can run arbitrary code in this or any later job.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy resolves/installs pip dependencies (rns, lxmf) at build
      # time via a build-machine Python interpreter, not just on-device —
      # its version must match app/build.gradle.kts's chaquopy.version
      # ("3.12"). Explicit rather than relying on the runner image's
      # preinstalled default, which can change without this workflow
      # noticing.
      - name: Set up build-time Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Instrumented tests (app/src/androidTest) need a running emulator, unlike
  # the two jobs above. Split out so a flaky/slow emulator boot never blocks
  # the fast build-and-test feedback loop.
  instrumented-tests:
    runs-on: ubuntu-latest
    # See build-and-test's identical env var/comment for why this exists.
    env:
      MICRON2COMPOSE_DIR: micron2compose
      RNS_BLE_WRAPPER_DIR: RNS_BLE_Wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See build-and-test's identical step for why this is needed, why
      # `dev` is pinned, and why `path` is a subdirectory not `../...`.
      - name: Checkout micron2compose (composite-build dependency)
        uses: actions/checkout@v7
        with:
          repository: JamesM92/micron2compose
          ref: dev
          path: micron2compose

      # See build-and-test's identical step for why this is needed.
      - name: Checkout RNS_BLE_Wrapper (composite-build dependency)
        uses: actions/checkout@v7
        with:
          repository: JamesM92/RNS_BLE_Android-Wrapper
          ref: feature/nomadportal-integration-fixes
          path: RNS_BLE_Wrapper

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy resolves/installs pip dependencies (rns, lxmf) at build
      # time via a build-machine Python interpreter, not just on-device —
      # its version must match app/build.gradle.kts's chaquopy.version
      # ("3.12"). Explicit rather than relying on the runner image's
      # preinstalled default, which can change without this workflow
      # noticing.
      - name: Set up build-time Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31 # matches app/build.gradle.kts minSdk
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --no-daemon
