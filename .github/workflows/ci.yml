name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # settings.gradle.kts composite-builds micron2compose from a sibling
      # checkout (includeBuild("../micron2compose") — it isn't published,
      # so there's no Maven coordinate to just resolve). That sibling only
      # exists on a dev machine that happens to have both repos cloned
      # side-by-side; the runner has nothing there by default, which is
      # exactly why every job here failed with "Included build
      # '.../micron2compose' does not exist" once Actions came back up.
      # Pinned to `dev`, not `main`: `dev` is what's actually being built/
      # tested against locally right now (micron2compose's own `main` only
      # gets updates once it's agreed "ready" — see that repo's own
      # workflow convention). This does couple this build's CI health to
      # micron2compose's `dev` branch being buildable — acceptable while
      # both repos are developed in lockstep pre-release, but revisit once
      # micron2compose is actually published (delete this step entirely
      # alongside the includeBuild block per settings.gradle.kts's comment).
      - name: Checkout micron2compose (composite-build dependency)
        uses: actions/checkout@v7
        with:
          repository: JamesM92/micron2compose
          ref: dev
          path: ../micron2compose

      # Fails the build if gradlew/gradlew.bat/gradle-wrapper.jar don't match
      # a known-good Gradle wrapper checksum — catches a tampered wrapper
      # before it can run arbitrary code in this or any later job.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy resolves/installs pip dependencies (rns, lxmf) at build
      # time via a build-machine Python interpreter, not just on-device —
      # its version must match app/build.gradle.kts's chaquopy.version
      # ("3.12"). Explicit rather than relying on the runner image's
      # preinstalled default, which can change without this workflow
      # noticing.
      - name: Set up build-time Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Instrumented tests (app/src/androidTest) need a running emulator, unlike
  # the two jobs above. Split out so a flaky/slow emulator boot never blocks
  # the fast build-and-test feedback loop.
  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See build-and-test's identical step for why this is needed and why
      # `dev` is pinned.
      - name: Checkout micron2compose (composite-build dependency)
        uses: actions/checkout@v7
        with:
          repository: JamesM92/micron2compose
          ref: dev
          path: ../micron2compose

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy resolves/installs pip dependencies (rns, lxmf) at build
      # time via a build-machine Python interpreter, not just on-device —
      # its version must match app/build.gradle.kts's chaquopy.version
      # ("3.12"). Explicit rather than relying on the runner image's
      # preinstalled default, which can change without this workflow
      # noticing.
      - name: Set up build-time Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31 # matches app/build.gradle.kts minSdk
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --no-daemon
