name: Release

# Beta-stage distribution: builds the same debug APK CI already verifies
# on every push (see ci.yml's own "Assemble debug APK" step) and attaches
# it to a GitHub Release, so testers have somewhere to actually download
# it from instead of needing a full Android build toolchain. Deliberately
# NOT a signed release build — no keystore/secrets setup exists yet, and
# per explicit direction a debug-signed beta APK is an acceptable
# distribution method for now. Revisit (real release keystore, a
# `assembleRelease` signing config, Play Store) once this project is past
# early beta.
#
# Triggered by pushing a tag matching v* (e.g. v0.0.1) — never runs on an
# ordinary push/PR, so cutting a release is always a deliberate, separate
# action from normal development.
#
# Per explicit direction: dev stays a loose, unprotected branch (nothing
# there blocks a push), but main and releases both require the full
# audit — main's own branch protection requires ci.yml + CodeQL to pass
# before anything can merge into it, and the "Verify this tag is on main"
# step below is what actually enforces that for a release, rather than
# just documenting the expectation: it refuses to publish anything for a
# tag that isn't reachable from main, so a tag accidentally cut against
# an un-audited dev commit fails loudly instead of silently shipping.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # only this workflow needs it, to create the Release — ci.yml's own jobs stay read-only.

jobs:
  release:
    runs-on: ubuntu-latest
    # See ci.yml's identical env var/comment for why this exists.
    env:
      RNS_BLE_WRAPPER_DIR: RNS_BLE_Wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone — the ancestry
          # check right below needs real commit-graph depth to reliably
          # find (or correctly fail to find) a common ancestor.
          fetch-depth: 0

      - name: Verify this tag is on main (the audited branch)
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}) is not reachable from main. Releases must be cut from main, which requires the full CI/CodeQL audit to pass before anything merges in (see main's own branch protection) — dev itself is deliberately not gated. Merge this work into main via a reviewed PR first, then tag main's own tip."
            exit 1
          fi

      # See ci.yml's identical step for why this is needed and why
      # feature/nomadportal-integration-fixes, not main, is pinned.
      - name: Checkout RNS_BLE_Wrapper (composite-build dependency)
        uses: actions/checkout@v7
        with:
          repository: JamesM92/RNS_BLE_Android-Wrapper
          ref: feature/nomadportal-integration-fixes
          path: RNS_BLE_Wrapper

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # See ci.yml's identical step for why this must match
      # app/build.gradle.kts's chaquopy.version exactly.
      - name: Set up build-time Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Renamed (not just uploaded as-is) so the download itself carries
      # the version and the fact that it's a debug build, not something a
      # tester has to already know from context.
      - name: Rename APK for release
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/debug/app-debug.apk \
            "release-out/NomadPortal-Android-${GITHUB_REF_NAME}-debug.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-out/*.apk \
            --title "NomadPortal-Android ${GITHUB_REF_NAME}" \
            --notes "Early beta. **This is a debug build, not a signed release APK** — there's no release keystore set up yet, so Android will show this as a debuggable/untrusted-source install. Appropriate for beta testers, not general distribution. See the README for what's actually working and the security disclaimer." \
            --prerelease
