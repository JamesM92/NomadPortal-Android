[versions]
# Verified against Chaquopy's own live demo project (chaquo/chaquopy@master, demo/)
# and each artifact's Maven Central / Google Maven metadata — see commit message
# for the check performed. Chaquopy 17.0 supports Python 3.10-3.14, AGP 7.3-9.2
# per its published docs table, but its own current demo project builds cleanly
# against AGP 9.3.1 / Gradle 9.5.0, which is the combo pinned here.
agp = "9.3.2"
kotlin = "2.4.10"
chaquopy = "17.0.0"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
datastorePreferences = "1.2.1"
# Not covered by composeBom (this artifact stopped tracking the Compose
# release train at 1.7.8) — pinned explicitly.
materialIconsExtended = "1.7.8"
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
# Real published tag (JitPack builds com.github.JamesM92:micron2compose
# from this repo's GitHub Releases — see settings.gradle.kts's own JitPack
# content-filter comment). Was ignored under an includeBuild composite-
# build substitution while the library was still unreleased; that
# substitution is gone now that a real tag exists to depend on.
micron2compose = "v0.2.0"
# Version string is ignored while settings.gradle.kts's includeBuild
# dependency substitution is active (builds from the local sibling
# checkout instead) — same shape micron2compose's own entry above used
# before it was published. Will become the real published tag once
# RNS_BLE_Wrapper is actually released and that substitution is removed.
rnsbleCore = "0.0.1"
# QR scanning (add-contact-by-QR) — CameraX, not ML Kit/Play Services
# Vision: this app has no other Google-Play-Services dependency anywhere,
# and CameraX + a plain decode library keeps that true. Verified against
# Google's own Maven metadata (dl.google.com/android/maven2/androidx/camera/
# camera-core/maven-metadata.xml) — 1.6.1 is the latest non-alpha/beta/rc
# release as of this pin, not guessed.
cameraX = "1.6.1"
# QR encode/decode — pure Java, no Android/Play-Services dependency,
# consistent with the CameraX choice above. Verified against Maven
# Central's own listing (central.sonatype.com/artifact/com.google.zxing/core) —
# 3.5.4 is the latest release as of this pin.
zxingCore = "3.5.4"
# rnsh's real device-credential gate (BiometricPrompt with a
# DEVICE_CREDENTIAL fallback) — verified against Google Maven's own
# metadata (dl.google.com/android/maven2/androidx/biometric/biometric/
# maven-metadata.xml): 1.1.0 is the latest *stable* release (the library
# jumps straight from there to 1.4.0-alpha builds, no intervening stable
# 1.2/1.3), matching this project's own "not the newest alpha/beta/rc"
# pinning convention already used for cameraX/zxingCore above.
androidxBiometric = "1.1.0"
# Battery-friendly notification mode's periodic background check
# (Settings → Notifications) — verified latest stable via Google
# Maven's own metadata (dl.google.com/android/maven2/androidx/work/
# work-runtime-ktx/maven-metadata.xml), same "not the newest alpha/
# beta/rc" pinning convention as every other dependency here.
androidxWork = "2.11.2"
# Real, on-device-confirmed bug fix, not a preemptive bump: appcompat
# 1.2.0 and camera-core both transitively pull androidx.fragment 1.2.5
# (confirmed via `./gradlew :app:dependencies`), and nothing else in this
# graph requests a newer one, so Gradle's conflict resolution settles on
# that ancient version. 1.2.5's own FragmentActivity.startActivityForResult
# override still carries a `checkForValidRequestCode` check rejecting any
# requestCode >= 0x10000 (confirmed against real FragmentActivity.java
# source at that version's era; removed entirely in current
# androidx-main) — but ComponentActivity's own ActivityResultRegistry
# (which every `rememberLauncherForActivityResult` call in this app goes
# through) *deliberately* generates request codes starting at exactly
# 0x00010000 (INITIAL_REQUEST_CODE_VALUE, confirmed against real
# ActivityResultRegistry.kt source) specifically to avoid colliding with
# legacy manually-assigned low codes. On a FragmentActivity subclass
# (this app's MainActivity, required for BiometricPrompt — see
# MainActivity's own doc comment) stuck on fragment 1.2.5, those two
# real, verified-from-source facts are flatly incompatible: EVERY
# activity-result launcher on ANY FragmentActivity throws
# "IllegalArgumentException: Can only use lower 16 bits for requestCode"
# on every single launch, deterministically, not intermittently — this
# is exactly the real crash IdentitiesScreen.kt's import-identity file
# picker hit on-device (100% reproducible, not the "long session/many
# registrations" theory an earlier version of that file's own comment
# guessed at before this was actually traced to its root cause).
# Verified latest stable via Google Maven's own metadata
# (dl.google.com/android/maven2/androidx/fragment/fragment/maven-
# metadata.xml) — 1.9.0 is current and already ships the fix.
androidxFragment = "1.9.0"
# RNode-over-USB support — root-free Android USB-serial, the same real,
# independently-maintained library Columba's own real RNode
# implementation uses (confirmed against its build.gradle.kts this
# session) rather than a reason to build a second one. Verified latest
# stable directly against the project's own GitHub Releases page
# (v3.11.0, published July 2026) — not Columba's older 3.7.0 pin,
# matching this project's own "verify current, don't copy someone
# else's possibly-stale pin" convention.
usbSerialForAndroid = "3.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# ProcessLifecycleOwner (rnsh's real background-auto-disconnect signal —
# see RnshTerminalScreen's own doc comment) — androidx.lifecycle:
# lifecycle-process was already on the resolved dependency graph
# transitively (confirmed via `./gradlew :app:dependencies`) but only as
# a version *constraint*, not an actual compile-time dependency; needed
# as an explicit one to actually reference ProcessLifecycleOwner from
# Kotlin. Same lifecycleRuntimeKtx version ref — this artifact is
# version-aligned with lifecycle-runtime-ktx in the same androidx.
# lifecycle release train.
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
micron2compose = { group = "com.github.JamesM92", name = "micron2compose", version.ref = "micron2compose" }
rnsble-core = { group = "com.jamesm92.rnsble", name = "rnsble-core", version.ref = "rnsbleCore" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }
# Alias deliberately isn't "usb-serial-for-android" (matching the real
# Maven artifact name) — Gradle's version-catalog accessor generation
# turns each dash-delimited segment into a property, and "for" as a bare
# segment collides with Kotlin's own `for` keyword in the generated
# accessor (a real build failure hit here, not a preemptive guess):
# `libs.usb.serial.for.android` doesn't parse. `usb-serial-android`
# avoids the collision; the actual Maven `name` coordinate below is
# unaffected either way.
usb-serial-android = { group = "com.github.mik3y", name = "usb-serial-for-android", version.ref = "usbSerialForAndroid" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# org.jetbrains.kotlin.android is deliberately absent: AGP 9.0+ has Kotlin
# support built in and rejects that plugin outright (see
# nomadportal-android-scaffold-decisions memory / app/build.gradle.kts).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
